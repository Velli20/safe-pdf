[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "Build automation tasks for safe-pdf"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
pdf-annotation-core = { path = "../crates/pdf-annotation-core", features = ["typescript"] }
pdf-web = { path = "../crates/pdf-web", features = ["typescript"] }
ts-rs = "12"
