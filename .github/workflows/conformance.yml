name: Conformance

# Renders the PDFium and pdf.js test corpora with Safe-PDF and compares them with pages
# rendered by the PDFium library without annotations or form fields, which matches Safe-PDF's
# content-only render. (The pdfium_tests goldens draw annotations, so CI does not use them.)
#
# - Push to main (a merged pull request) and manual runs on main: one `issues` job files,
#   updates and closes GitHub issues for both corpora together, and the viewers are
#   published to GitHub Pages under /conformance/.
# - Pull requests that are ready for review: the full corpora run and a `pr-report` job
#   comments what the change fixes and breaks. Report only; nothing fails the pull request.
#
# To gate pull requests on regressions later, add `pull_request` to FAIL_ON_EVENTS.
# See tools/conformance/README.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
    inputs:
      accept:
        description: "Record this run as the new baseline (uploaded as an artifact to commit)"
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests cancel superseded runs. Issue-filing runs queue behind each other so
# two runs never file the same cluster twice.
concurrency:
  group: conformance-${{ github.event_name == 'pull_request' && github.ref || 'issues' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Events whose regressions fail the job; none for now, so every run only reports.
  FAIL_ON_EVENTS: ""
  # Prebuilt PDFium (CI only) matching the `pdfium_7881` API of pdfium-render.
  PDFIUM_RELEASE: chromium/7881
  PDFIUM_SHA256: 1470e21b8b4a3b4ad7f85684e2da11d94f3b69a86d81dee11b9b6709d927ac1d

jobs:
  conformance:
    name: Conformance (${{ matrix.corpus }})
    # Draft pull requests are skipped; the run starts when the pull request is ready for review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        corpus: [pdfium, pdfjs]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/regression
          key: ${{ runner.os }}-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      # Pinned corpus revisions live in corpus.rs; the pdf.js cache also keeps downloaded
      # linked files so their (often slow or dead) hosts are only contacted on a miss.
      - name: Restore corpus
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: target/conformance/corpora/${{ matrix.corpus }}
          key: conformance-corpus-${{ matrix.corpus }}-${{ hashFiles('tools/conformance/src/corpus.rs') }}

      - name: Fetch corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: cargo conformance fetch --corpus ${{ matrix.corpus }} ${{ matrix.corpus == 'pdfjs' && '--links' || '' }}

      - name: Save corpus
        if: always() && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/conformance/corpora/${{ matrix.corpus }}
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}

      - name: Install prebuilt PDFium
        run: |
          dir="$RUNNER_TEMP/pdfium"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/pdfium.tgz" \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  $dir/pdfium.tgz" | sha256sum -c -
          tar -xzf "$dir/pdfium.tgz" -C "$dir"
          echo "PDFIUM_LIBRARY=$dir/lib/libpdfium.so" >> "$GITHUB_ENV"

      - name: Run conformance
        id: run
        run: |
          set +e
          cargo conformance run --corpus ${{ matrix.corpus }} --reference pdfium --jobs 4
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != 0 ]; then
            echo "::warning ::Conformance regressions against tools/conformance/baselines/${{ matrix.corpus }}.json; see the job summary and the conformance-${{ matrix.corpus }} artifact."
          fi

      - name: Job summary
        if: always()
        run: |
          triage="target/conformance/${{ matrix.corpus }}/TRIAGE.md"
          if [ -f "$triage" ]; then
            {
              sed '/^## Failure clusters/,$d' "$triage"
              if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.ref }}" = refs/heads/main ]; then
                owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                echo "Viewer (published when the run finishes): https://${owner}.github.io/${{ github.event.repository.name }}/conformance/${{ matrix.corpus }}/"
                echo
              fi
              echo "## Largest failure clusters"
              grep '^### ' "$triage" | head -25 | sed 's/^### /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.corpus }}
          path: target/conformance/${{ matrix.corpus }}
          retention-days: 14
          if-no-files-found: warn

      - name: Record baseline
        if: github.event_name == 'workflow_dispatch' && inputs.accept
        run: cargo conformance accept --corpus ${{ matrix.corpus }}

      - name: Upload baseline
        if: github.event_name == 'workflow_dispatch' && inputs.accept
        uses: actions/upload-artifact@v4
        with:
          name: conformance-baseline-${{ matrix.corpus }}
          path: tools/conformance/baselines/${{ matrix.corpus }}.json

      - name: Fail on regressions
        if: steps.run.outputs.status != '0' && env.FAIL_ON_EVENTS != '' && contains(env.FAIL_ON_EVENTS, github.event_name)
        run: |
          echo "::error ::Conformance regressions against tools/conformance/baselines/${{ matrix.corpus }}.json (exit ${{ steps.run.outputs.status }}); see the job summary and the conformance-${{ matrix.corpus }} artifact."
          exit 1

  # Both corpora are reported together, so one cause found in both is one issue and an issue
  # is only closed when every corpus it was seen in no longer has it.
  issues:
    name: File GitHub issues
    needs: conformance
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/regression
          key: ${{ runner.os }}-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: reports

      - name: File, update and close issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=""
          for corpus in pdfium pdfjs; do
            if [ -f "reports/conformance-$corpus/index.json" ]; then
              mkdir -p target/conformance
              rm -rf "target/conformance/$corpus"
              mv "reports/conformance-$corpus" "target/conformance/$corpus"
              args="$args --corpus $corpus"
            else
              echo "::warning ::No $corpus report in this run; its issues are left unchanged."
            fi
          done
          if [ -z "$args" ]; then
            echo "::warning ::No reports to file issues from."
            exit 0
          fi
          cargo conformance issues $args --repo "${{ github.repository }}" --max-new 15

  pr-report:
    name: Pull request report
    needs: conformance
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/regression
          key: ${{ runner.os }}-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: reports

      - name: Write and post the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=""
          for corpus in pdfium pdfjs; do
            if [ -f "reports/conformance-$corpus/index.json" ]; then
              mkdir -p target/conformance
              rm -rf "target/conformance/$corpus"
              mv "reports/conformance-$corpus" "target/conformance/$corpus"
              args="$args --corpus $corpus"
            fi
          done
          if [ -z "$args" ]; then
            echo "::warning ::No reports to compare."
            exit 0
          fi
          cargo conformance pr-report $args --repo "${{ github.repository }}" --out target/conformance/pr-report.md
          cat target/conformance/pr-report.md >> "$GITHUB_STEP_SUMMARY"
          # Fork pull requests get a read-only token; the job summary still has the report.
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --body-file target/conformance/pr-report.md --edit-last --create-if-none \
            || echo "::warning ::Could not comment on the pull request; the report is in the job summary."

  publish:
    name: Publish reports to GitHub Pages
    needs: conformance
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    # Shared with ci.yml, which deploys the same site.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}conformance/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: reports

      # Only the viewer and what it links to; results.json and issue bodies stay in the
      # run artifacts.
      - name: Stage reports
        run: |
          mkdir -p site/conformance
          items=""
          for corpus in pdfium pdfjs; do
            src="reports/conformance-$corpus"
            if [ ! -f "$src/index.html" ]; then
              items="$items<li>$corpus: no report in this run</li>"
              continue
            fi
            rm -rf "$src/results.json" "$src/issues"
            mv "$src" "site/conformance/$corpus"
            totals=$(grep -m1 -E '^[0-9]+ documents:' "site/conformance/$corpus/TRIAGE.md" || true)
            items="$items<li><a href=\"$corpus/\">$corpus</a> · <a href=\"$corpus/TRIAGE.md\">TRIAGE.md</a><br><span>$totals</span></li>"
          done
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          commit_url="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          cat > site/conformance/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Safe-PDF conformance</title>
          <style>
            :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
            body { max-width: 720px; margin: 32px auto; padding: 0 16px; }
            li { margin: 12px 0; }
            span, p { color: GrayText; }
          </style>
          </head>
          <body>
          <h1>Safe-PDF conformance</h1>
          <p>Safe-PDF compared with PDFium, both rendering page content without annotations or form fields.</p>
          <ul>$items</ul>
          <p>Commit <a href="$commit_url">${GITHUB_SHA::7}</a> · <a href="$run_url">workflow run</a> · $(date -u '+%Y-%m-%d %H:%M UTC')</p>
          <p><a href="../">Safe-PDF web viewer</a></p>
          </body>
          </html>
          HTML

      - name: Upload conformance site
        uses: actions/upload-artifact@v4
        with:
          name: pages-conformance
          path: site/conformance
          retention-days: 90

      - name: Add web-canvas site
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/assemble-pages.sh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary
        run: |
          echo "Conformance reports: ${{ steps.deployment.outputs.page_url }}conformance/" >> "$GITHUB_STEP_SUMMARY"
