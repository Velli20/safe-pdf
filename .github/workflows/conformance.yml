name: Conformance

# Checks Safe-PDF against the PDFium and pdf.js test corpora, with PDFium as the reference
# (rendered without annotations or form fields, which matches Safe-PDF's content-only render;
# the pdfium_tests goldens draw annotations, so CI does not use them).
#
# - `reads` (pull requests, pushes to main, manual runs): reads every document of both
#   corpora with Safe-PDF and PDFium and compares page counts; no page is rendered. On a pull
#   request the reads are compared with the base commit's (cached by the run on main, or read
#   at the base commit when the cache has none), and `read-comment` posts one comment on the
#   pull request when a document reads worse or better, updating it on later pushes.
# - `conformance` (main and manual runs only): renders the PDFium corpus and compares every
#   page with PDFium. The pdf.js corpus is not rendered; only its reads are reported.
# - On main, `issues` files, updates and closes GitHub issues from the PDFium render and the
#   pdf.js reads together, and the viewers are published to GitHub Pages under /conformance/.
#
# Pull requests are never failed by these jobs. See tools/conformance/README.md.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      accept:
        description: "Record this run as the new baseline (uploaded as an artifact to commit)"
        type: boolean
        default: false

permissions:
  contents: read

# Runs on main queue behind each other so two runs never file the same cluster twice; a new
# push to a pull request cancels its older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('conformance-pr-{0}', github.event.pull_request.number) || 'conformance-issues' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Events whose regressions fail the job; none for now, so every run only reports.
  FAIL_ON_EVENTS: ""
  # Prebuilt PDFium (CI only) matching the `pdfium_7881` API of pdfium-render.
  PDFIUM_RELEASE: chromium/7881
  PDFIUM_SHA256: 1470e21b8b4a3b4ad7f85684e2da11d94f3b69a86d81dee11b9b6709d927ac1d

jobs:
  reads:
    name: Reads (${{ matrix.corpus }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        corpus: [pdfium, pdfjs]
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/regression
          key: ${{ runner.os }}-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      - name: Restore corpus
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: target/conformance/corpora/${{ matrix.corpus }}
          key: conformance-corpus-${{ matrix.corpus }}-${{ hashFiles('tools/conformance/src/corpus.rs') }}

      - name: Fetch corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: cargo conformance fetch --corpus ${{ matrix.corpus }} ${{ matrix.corpus == 'pdfjs' && '--links' || '' }}

      - name: Save corpus
        if: always() && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/conformance/corpora/${{ matrix.corpus }}
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}

      - name: Install prebuilt PDFium
        run: |
          dir="$RUNNER_TEMP/pdfium"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/pdfium.tgz" \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  $dir/pdfium.tgz" | sha256sum -c -
          tar -xzf "$dir/pdfium.tgz" -C "$dir"
          echo "PDFIUM_LIBRARY=$dir/lib/libpdfium.so" >> "$GITHUB_ENV"

      - name: Read corpus
        run: cargo conformance run --corpus ${{ matrix.corpus }} --reference pdfium --read-only --jobs 4

      - name: Job summary
        if: always()
        run: |
          triage="target/conformance/${{ matrix.corpus }}/TRIAGE.md"
          if [ -f "$triage" ]; then
            {
              sed '/^## Failure clusters/,$d' "$triage"
              echo "## Largest failure clusters"
              grep '^### ' "$triage" | head -25 | sed 's/^### /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reads-${{ matrix.corpus }}
          path: target/conformance/${{ matrix.corpus }}
          retention-days: 14
          if-no-files-found: warn

      # Reads of main are the base pull requests are compared with, keyed by commit.
      - name: Stage reads for the cache
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p target/conformance/read-baseline
          cp "target/conformance/${{ matrix.corpus }}/reads.json" "target/conformance/read-baseline/${{ matrix.corpus }}.json"

      - name: Save reads
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: target/conformance/read-baseline/${{ matrix.corpus }}.json
          key: conformance-reads-${{ matrix.corpus }}-${{ github.sha }}

      - name: Restore base reads
        id: base-reads
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: target/conformance/read-baseline/${{ matrix.corpus }}.json
          key: conformance-reads-${{ matrix.corpus }}-${{ env.BASE_SHA }}

      # No run on main has cached the base commit's reads yet (it is still running, or its
      # cache was evicted), so read the corpus at the base commit here.
      - name: Read corpus at the base commit
        id: base-run
        if: github.event_name == 'pull_request' && steps.base-reads.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          base="$RUNNER_TEMP/base"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$base" "$BASE_SHA"
          cd "$base"
          if ! grep -q 'read_only: bool' tools/conformance/src/main.rs; then
            echo "::notice ::The base commit predates read-only conformance runs; nothing to compare with."
            exit 0
          fi
          # Builds into its own target directory: workspace crates hash the same at both commits,
          # so sharing the head's would overwrite its artifacts and break the comparison below.
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/base-build"
          cargo conformance run --corpus ${{ matrix.corpus }} --reference pdfium --read-only --jobs 4 \
            --root "$GITHUB_WORKSPACE/target/conformance/corpora/${{ matrix.corpus }}"
          mkdir -p "$GITHUB_WORKSPACE/target/conformance/read-baseline"
          cp "target/conformance/${{ matrix.corpus }}/reads.json" \
            "$GITHUB_WORKSPACE/target/conformance/read-baseline/${{ matrix.corpus }}.json"
          echo "read=true" >> "$GITHUB_OUTPUT"

      - name: Save base reads
        if: steps.base-run.outputs.read == 'true'
        uses: actions/cache/save@v4
        with:
          path: target/conformance/read-baseline/${{ matrix.corpus }}.json
          key: conformance-reads-${{ matrix.corpus }}-${{ env.BASE_SHA }}

      - name: Compare reads with the base commit
        if: github.event_name == 'pull_request'
        run: |
          base="target/conformance/read-baseline/${{ matrix.corpus }}.json"
          if [ ! -f "$base" ]; then
            echo "No reads of the base commit to compare with." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo conformance read-diff --corpus ${{ matrix.corpus }} --base "$base"
          cat "target/conformance/${{ matrix.corpus }}/read-diff.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload read diff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: read-diff-${{ matrix.corpus }}
          path: |
            target/conformance/${{ matrix.corpus }}/read-diff.md
            target/conformance/${{ matrix.corpus }}/read-diff.json
          retention-days: 14
          if-no-files-found: ignore

  # One comment per pull request, posted when a document reads worse or better than on the
  # base commit and kept up to date on later pushes.
  read-comment:
    name: Comment read changes
    needs: reads
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download read diffs
        uses: actions/download-artifact@v4
        with:
          pattern: read-diff-*
          path: diffs

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/conformance-read-comment.sh diffs

  conformance:
    name: Conformance (${{ matrix.corpus }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # pdf.js pages are not rendered; the `reads` job covers that corpus.
        corpus: [pdfium]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/regression
          key: ${{ runner.os }}-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      # Pinned corpus revisions live in corpus.rs; the pdf.js cache also keeps downloaded
      # linked files so their (often slow or dead) hosts are only contacted on a miss.
      - name: Restore corpus
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: target/conformance/corpora/${{ matrix.corpus }}
          key: conformance-corpus-${{ matrix.corpus }}-${{ hashFiles('tools/conformance/src/corpus.rs') }}

      - name: Fetch corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: cargo conformance fetch --corpus ${{ matrix.corpus }} ${{ matrix.corpus == 'pdfjs' && '--links' || '' }}

      - name: Save corpus
        if: always() && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/conformance/corpora/${{ matrix.corpus }}
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}

      - name: Install prebuilt PDFium
        run: |
          dir="$RUNNER_TEMP/pdfium"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/pdfium.tgz" \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  $dir/pdfium.tgz" | sha256sum -c -
          tar -xzf "$dir/pdfium.tgz" -C "$dir"
          echo "PDFIUM_LIBRARY=$dir/lib/libpdfium.so" >> "$GITHUB_ENV"

      - name: Run conformance
        id: run
        run: |
          set +e
          cargo conformance run --corpus ${{ matrix.corpus }} --reference pdfium --jobs 4
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != 0 ]; then
            echo "::warning ::Conformance regressions against tools/conformance/baselines/${{ matrix.corpus }}.json; see the job summary and the conformance-${{ matrix.corpus }} artifact."
          fi

      - name: Job summary
        if: always()
        run: |
          triage="target/conformance/${{ matrix.corpus }}/TRIAGE.md"
          if [ -f "$triage" ]; then
            {
              sed '/^## Failure clusters/,$d' "$triage"
              if [ "${{ github.ref }}" = refs/heads/main ]; then
                owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                echo "Viewer (published when the run finishes): https://${owner}.github.io/${{ github.event.repository.name }}/conformance/${{ matrix.corpus }}/"
                echo
              fi
              echo "## Largest failure clusters"
              grep '^### ' "$triage" | head -25 | sed 's/^### /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.corpus }}
          path: target/conformance/${{ matrix.corpus }}
          retention-days: 14
          if-no-files-found: warn

      - name: Record baseline
        if: github.event_name == 'workflow_dispatch' && inputs.accept
        run: cargo conformance accept --corpus ${{ matrix.corpus }}

      - name: Upload baseline
        if: github.event_name == 'workflow_dispatch' && inputs.accept
        uses: actions/upload-artifact@v4
        with:
          name: conformance-baseline-${{ matrix.corpus }}
          path: tools/conformance/baselines/${{ matrix.corpus }}.json

      - name: Fail on regressions
        if: steps.run.outputs.status != '0' && env.FAIL_ON_EVENTS != '' && contains(env.FAIL_ON_EVENTS, github.event_name)
        run: |
          echo "::error ::Conformance regressions against tools/conformance/baselines/${{ matrix.corpus }}.json (exit ${{ steps.run.outputs.status }}); see the job summary and the conformance-${{ matrix.corpus }} artifact."
          exit 1

  # Both corpora are reported together, so one cause found in both is one issue and an issue
  # is only closed when every corpus it was seen in no longer has it. The pdf.js report is a
  # read-only run, which files and refreshes issues but never closes them.
  issues:
    name: File GitHub issues
    needs: [ conformance, reads ]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/regression
          key: ${{ runner.os }}-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: File, update and close issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=""
          # The PDFium corpus is rendered; the pdf.js corpus is only read.
          for report in conformance-pdfium reads-pdfjs; do
            corpus=${report#*-}
            if [ -f "reports/$report/index.json" ]; then
              mkdir -p target/conformance
              rm -rf "target/conformance/$corpus"
              mv "reports/$report" "target/conformance/$corpus"
              args="$args --corpus $corpus"
            else
              echo "::warning ::No $corpus report in this run; its issues are left unchanged."
            fi
          done
          if [ -z "$args" ]; then
            echo "::warning ::No reports to file issues from."
            exit 0
          fi
          cargo conformance issues $args --repo "${{ github.repository }}" --max-new 15

  publish:
    name: Publish reports to GitHub Pages
    needs: [ conformance, reads ]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    # Shared with ci.yml, which deploys the same site.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}conformance/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      # Only the viewer and what it links to; results.json and issue bodies stay in the
      # run artifacts.
      - name: Stage reports
        run: |
          mkdir -p site/conformance
          items=""
          # The PDFium corpus is rendered; the pdf.js corpus is only read.
          for report in conformance-pdfium reads-pdfjs; do
            corpus=${report#*-}
            src="reports/$report"
            if [ ! -f "$src/index.html" ]; then
              items="$items<li>$corpus: no report in this run</li>"
              continue
            fi
            rm -rf "$src/results.json" "$src/issues"
            mv "$src" "site/conformance/$corpus"
            totals=$(grep -m1 -E '^[0-9]+ documents:' "site/conformance/$corpus/TRIAGE.md" || true)
            items="$items<li><a href=\"$corpus/\">$corpus</a> · <a href=\"$corpus/TRIAGE.md\">TRIAGE.md</a><br><span>$totals</span></li>"
          done
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          commit_url="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          cat > site/conformance/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Safe-PDF conformance</title>
          <style>
            :root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
            body { max-width: 720px; margin: 32px auto; padding: 0 16px; }
            li { margin: 12px 0; }
            span, p { color: GrayText; }
          </style>
          </head>
          <body>
          <h1>Safe-PDF conformance</h1>
          <p>Safe-PDF compared with PDFium, both rendering page content without annotations or form fields.</p>
          <ul>$items</ul>
          <p>Commit <a href="$commit_url">${GITHUB_SHA::7}</a> · <a href="$run_url">workflow run</a> · $(date -u '+%Y-%m-%d %H:%M UTC')</p>
          <p><a href="../">Safe-PDF web viewer</a></p>
          </body>
          </html>
          HTML

      - name: Upload conformance site
        uses: actions/upload-artifact@v4
        with:
          name: pages-conformance
          path: site/conformance
          retention-days: 90

      - name: Add web-canvas site
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/assemble-pages.sh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Job summary
        run: |
          echo "Conformance reports: ${{ steps.deployment.outputs.page_url }}conformance/" >> "$GITHUB_STEP_SUMMARY"
