name: Conformance

# Renders the PDFium and pdf.js test corpora with Safe-PDF and compares them with PDFium.
# Runs when a pull request is merged (push to main) and on manual dispatch, and files one
# GitHub issue per unreported failure cluster. Regressions never fail these runs; they are
# reported through issues, the job summary and the uploaded report.
#
# To gate pull requests instead: uncomment the `pull_request` trigger below. Pull request
# runs fail on regressions against tools/conformance/baselines/ (see FAIL_ON_EVENTS) and
# never file issues. See tools/conformance/README.md.

on:
  push:
    branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:
    inputs:
      accept:
        description: "Record this run as the new baseline (uploaded as an artifact to commit)"
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests cancel superseded runs. Issue-filing runs queue behind each other so
# two runs never file the same cluster twice.
concurrency:
  group: conformance-${{ github.event_name == 'pull_request' && github.ref || 'issues' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Events whose regressions fail the job. Pushes to main only report them.
  FAIL_ON_EVENTS: pull_request
  # Prebuilt PDFium (CI only) matching the `pdfium_7881` API of pdfium-render.
  PDFIUM_RELEASE: chromium/7881
  PDFIUM_SHA256: 1470e21b8b4a3b4ad7f85684e2da11d94f3b69a86d81dee11b9b6709d927ac1d

jobs:
  conformance:
    name: Conformance (${{ matrix.corpus }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        corpus: [pdfium, pdfjs]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/regression
          key: ${{ runner.os }}-conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      # Pinned corpus revisions live in corpus.rs; the pdf.js cache also keeps downloaded
      # linked files so their (often slow or dead) hosts are only contacted on a miss.
      - name: Restore corpus
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: target/conformance/corpora/${{ matrix.corpus }}
          key: conformance-corpus-${{ matrix.corpus }}-${{ hashFiles('tools/conformance/src/corpus.rs') }}

      - name: Fetch corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: cargo conformance fetch --corpus ${{ matrix.corpus }} ${{ matrix.corpus == 'pdfjs' && '--links' || '' }}

      - name: Save corpus
        if: always() && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/conformance/corpora/${{ matrix.corpus }}
          key: ${{ steps.corpus-cache.outputs.cache-primary-key }}

      - name: Install prebuilt PDFium
        if: matrix.corpus == 'pdfjs'
        run: |
          dir="$RUNNER_TEMP/pdfium"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/pdfium.tgz" \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-linux-x64.tgz"
          echo "${PDFIUM_SHA256}  $dir/pdfium.tgz" | sha256sum -c -
          tar -xzf "$dir/pdfium.tgz" -C "$dir"
          echo "PDFIUM_LIBRARY=$dir/lib/libpdfium.so" >> "$GITHUB_ENV"

      - name: Run conformance
        id: run
        run: |
          set +e
          cargo conformance run --corpus ${{ matrix.corpus }} --jobs 4
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != 0 ]; then
            echo "::warning ::Conformance regressions against tools/conformance/baselines/${{ matrix.corpus }}.json; see the job summary and the conformance-${{ matrix.corpus }} artifact."
          fi

      - name: Job summary
        if: always()
        run: |
          triage="target/conformance/${{ matrix.corpus }}/TRIAGE.md"
          if [ -f "$triage" ]; then
            {
              sed '/^## Failure clusters/,$d' "$triage"
              echo "## Largest failure clusters"
              grep '^### ' "$triage" | head -25 | sed 's/^### /- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.corpus }}
          path: target/conformance/${{ matrix.corpus }}
          retention-days: 14
          if-no-files-found: warn

      - name: File GitHub issues
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo conformance issues --corpus ${{ matrix.corpus }} --repo "${{ github.repository }}" --max-new 15

      - name: Record baseline
        if: github.event_name == 'workflow_dispatch' && inputs.accept
        run: cargo conformance accept --corpus ${{ matrix.corpus }}

      - name: Upload baseline
        if: github.event_name == 'workflow_dispatch' && inputs.accept
        uses: actions/upload-artifact@v4
        with:
          name: conformance-baseline-${{ matrix.corpus }}
          path: tools/conformance/baselines/${{ matrix.corpus }}.json

      - name: Fail on regressions
        if: steps.run.outputs.status != '0' && contains(env.FAIL_ON_EVENTS, github.event_name)
        run: |
          echo "::error ::Conformance regressions against tools/conformance/baselines/${{ matrix.corpus }}.json (exit ${{ steps.run.outputs.status }}); see the job summary and the conformance-${{ matrix.corpus }} artifact."
          exit 1
