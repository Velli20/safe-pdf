name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        rust: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install system dependencies (Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev
        shell: bash

      - name: Cache cargo registry + git + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Show cargo version
        run: cargo --version --verbose

      - name: Fetch dependencies
        run: cargo fetch

      - name: Build (check) workspace
        run: cargo check --workspace --exclude examples

      - name: Check generated annotation contract
        run: cargo xtask annotation-types --check

      - name: Type-check native annotation components
        run: npx --yes --package=typescript@5.9.3 tsc --project crates/pdf-web/tsconfig.json

      - name: Run tests
        run: cargo test --no-fail-fast

      - name: Run clippy (lints)
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Rustfmt check
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::error ::Code is not formatted. Run 'cargo fmt'";
            exit 1;
          fi

  minimal:
    name: Minimal feature build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies (Skia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev
        shell: bash
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-min-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-min-
      - name: Build default feature set
        run: cargo build --workspace

  web-canvas:
    name: Build web-canvas (wasm-bindgen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: ${{ runner.os }}-cargo-web-canvas-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-web-canvas-

      # Must match the `wasm-bindgen = "=0.2.100"` pin in the workspace;
      # `cargo xtask web-canvas` refuses any other CLI version.
      - name: Install wasm-bindgen-cli
        run: |
          if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version)" != "wasm-bindgen 0.2.100" ]; then
            cargo install wasm-bindgen-cli --version 0.2.100 --locked --force
          fi
          wasm-bindgen --version

      - name: Build web-canvas via cargo xtask
        run: cargo xtask web-canvas --profile release

      - name: Verify build artifacts exist
        run: |
          test -f examples/web-canvas/pkg/web_canvas_example.js
          test -f examples/web-canvas/pkg/web_canvas_example_bg.wasm
          test -f examples/web-canvas/pkg/annotation_layer.js
          test -f examples/web-canvas/pkg/annotation_layer.css
          echo "✅ web-canvas artifacts built successfully"
          ls -lh examples/web-canvas/pkg/

      - name: Stage Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp examples/web-canvas/index.html examples/web-canvas/host.js site/
          cp -r examples/web-canvas/pkg site/pkg

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, web-canvas]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
