<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Safe-PDF WASM Viewer</title>
    <!-- Inline favicon to avoid 404 requests in dev -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23cccccc'/%3E%3Ctext x='8' y='11' font-size='9' text-anchor='middle' fill='%23333'%3ES%3C/text%3E%3C/svg%3E" />
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0; padding: 0;
        background: #525659;
        overflow: hidden;
        height: 100vh;
      }
      .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* ---- Toolbar ---- */
      .toolbar {
        display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
        padding: 10px 20px;
        background: #323639;
        border-bottom: 1px solid #1a1a1a;
        color: #fff;
        z-index: 100;
      }
      .toolbar h1 { margin: 0; font-size: 18px; font-weight: 500; color: #fff; }
      .toolbar-spacer { flex: 1; }
      .control-group { display: flex; align-items: center; gap: 8px; }
      .control-group label {
        font-size: 12px; font-weight: 500; color: #aaa; text-transform: uppercase;
      }
      .control-group input, .control-group select {
        padding: 6px 10px; border: 1px solid #555; border-radius: 4px;
        font-size: 13px; background: #404346; color: #fff;
      }
      .control-group input[type="file"] { padding: 4px; }
      .btn {
        padding: 6px 14px; background: #0066cc; color: white;
        border: none; border-radius: 4px; cursor: pointer;
        font-size: 13px; font-weight: 500;
      }
      .btn:hover { background: #0055aa; }
      .btn:disabled { background: #555; cursor: not-allowed; }
      .btn-icon { padding: 6px 10px; background: transparent; border: 1px solid #555; }
      .btn-icon:hover { background: #404346; }
      .page-nav { display: flex; align-items: center; gap: 5px; }
      .page-nav input { width: 50px; text-align: center; }
      .page-nav span { color: #aaa; font-size: 13px; }

      /* ---- Viewer container (filled by SafePdfViewer) ---- */
      #viewerContainer { flex: 1; overflow: hidden; position: relative; }

      /* ---- Status bar ---- */
      .status-bar {
        padding: 6px 20px; background: #2a2d30; color: #aaa;
        font-size: 12px; display: flex; justify-content: space-between;
        border-top: 1px solid #1a1a1a;
      }
      .status-bar .cache-info { color: #6a6; }
      .status-bar.error { background: #4a2020; color: #faa; }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="toolbar">
        <h1>Safe-PDF Viewer</h1>
        <div class="toolbar-spacer"></div>

        <div class="control-group">
          <label for="pdfFile">Open</label>
          <input type="file" id="pdfFile" accept=".pdf,application/pdf" />
        </div>

        <div class="control-group page-nav">
          <button class="btn btn-icon" id="prevPage" disabled>◀</button>
          <input type="number" id="pageInput" value="1" min="1" disabled />
          <span id="pageTotal">/ 0</span>
          <button class="btn btn-icon" id="nextPage" disabled>▶</button>
        </div>

        <div class="control-group">
          <label for="zoomSelect">Zoom</label>
          <select id="zoomSelect" disabled>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
            <option value="fit-width">Fit Width</option>
            <option value="fit-page">Fit Page</option>
          </select>
        </div>
      </div>

      <!-- SafePdfViewer mounts its DOM here -->
      <div id="viewerContainer"></div>

      <div class="status-bar" id="statusBar">
        <span id="statusText">Loading WASM module...</span>
        <span id="cacheInfo" class="cache-info"></span>
      </div>
    </div>

    <!--
      ES-module entry point.
      All viewer logic lives in src/safe-pdf-viewer.js (and its dependency
      src/safe-pdf-renderer.js). This script just wires the toolbar to the
      viewer API.
    -->
    <script type="module">
      import { SafePdfViewer } from './src/safe-pdf-viewer.js';

      // ---- DOM refs ----
      const statusText  = document.getElementById('statusText');
      const statusBar   = document.getElementById('statusBar');
      const cacheInfo   = document.getElementById('cacheInfo');
      const pdfFile     = document.getElementById('pdfFile');
      const pageInput   = document.getElementById('pageInput');
      const pageTotal   = document.getElementById('pageTotal');
      const prevPage    = document.getElementById('prevPage');
      const nextPage    = document.getElementById('nextPage');
      const zoomSelect  = document.getElementById('zoomSelect');

      // ---- Helpers ----
      function setStatus(message, isError = false) {
        statusText.textContent = message;
        statusBar.classList.toggle('error', isError);
      }

      function updateCacheInfo() {
        const cached = viewer.getCachedPageCount();
        const total  = viewer.getPageCount();
        cacheInfo.textContent = total > 0 ? `Cache: ${cached}/${total} pages` : '';
      }

      function enableControls(enabled) {
        pageInput.disabled  = !enabled;
        prevPage.disabled   = !enabled;
        nextPage.disabled   = !enabled;
        zoomSelect.disabled = !enabled;
      }

      // ---- Create viewer ----
      const viewer = new SafePdfViewer(
        document.getElementById('viewerContainer'),
        { wasmUrl: './dist/emscripten.js' }
      );

      // ---- Viewer events ----
      viewer.addEventListener('ready', () => {
        setStatus('Ready. Open a PDF file to begin.');
      });

      viewer.addEventListener('load', (e) => {
        const { pageCount, fileName } = e.detail;
        enableControls(true);
        pageInput.max   = pageCount;
        pageInput.value = 1;
        pageTotal.textContent = `/ ${pageCount}`;
        setStatus(`PDF loaded: ${fileName ?? 'document'} (${pageCount} pages)`);
        updateCacheInfo();
      });

      viewer.addEventListener('pagechange', (e) => {
        pageInput.value = e.detail.pageNumber;
        updateCacheInfo();
      });

      viewer.addEventListener('error', (e) => {
        setStatus(e.detail.message, true);
      });

      // ---- Toolbar wiring ----
      pdfFile.addEventListener('change', (e) => {
        if (e.target.files.length > 0) viewer.loadFile(e.target.files[0]);
      });

      prevPage.addEventListener('click', () => viewer.previousPage());
      nextPage.addEventListener('click', () => viewer.nextPage());

      pageInput.addEventListener('change', function () {
        const page = parseInt(this.value, 10) - 1;
        if (!isNaN(page)) viewer.goToPage(page);
      });

      zoomSelect.addEventListener('change', function () {
        const val = this.value;
        viewer.setZoom(val === 'fit-width' || val === 'fit-page' ? val : parseFloat(val));
      });

      // ---- Boot ----
      viewer.init().catch((err) => {
        setStatus('Failed to initialise viewer: ' + err.message, true);
        console.error(err);
      });
    </script>
  </body>
</html>
