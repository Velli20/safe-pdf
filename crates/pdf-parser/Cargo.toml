[package]
name = "pdf-parser"
version = "0.1.0"
edition = "2024"

# Inherit all lint configurations from the workspace root
[lints]
workspace = true

[dependencies]
pdf-tokenizer = { path = "../pdf-tokenizer" }
pdf-object-reader = { path = "../pdf-object-reader" }
pdf-image = { path = "../pdf-image" }
pdf-filter = { path = "../pdf-filter" }
thiserror = "2.0.12"

[dev-dependencies]
criterion = "0.8"
flate2 = "1.1.1"

[[bench]]
name = "number_parsing"
harness = false
