[package]
name = "pdf-filter"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.9.1"
bytes = "1.10.1"
num-traits = "0.2.19"
thiserror = "2.0.12"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
zune-core = "0.5.1"
zune-jpeg = "0.5.15"
pdf-ccitt = { path = "../pdf-ccitt" }
pdf-jbig2 = { path = "../pdf-jbig2" }
pdf-object-reader = { path = "../pdf-object-reader" }
pdf-utils = { path = "../pdf-utils" }

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "flate_decode"
harness = false
