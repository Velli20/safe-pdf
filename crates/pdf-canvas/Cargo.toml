[package]
name = "pdf-canvas"
version = "0.1.0"
edition = "2024"

# Inherit all lint configurations from the workspace root
[lints]
workspace = true

[dependencies]
pdf-content-stream-operators = { path = "../pdf-content-stream-operators" }
pdf-content-stream = { path = "../pdf-content-stream" }
pdf-document = { path = "../pdf-document" }
pdf-resources = { path = "../pdf-resources" }
pdf-image = { path = "../pdf-image" }
pdf-text-engine = { path = "../pdf-text-engine" }
pdf-font = { path = "../pdf-font" }
pdf-cmap = { path = "../pdf-cmap" }
pdf-object = { path = "../pdf-object" }
pdf-graphics = { path = "../pdf-graphics" }
pdf-shading = { path = "../pdf-shading" }
pdf-color-space = { path = "../pdf-color-space" }
thiserror = "2.0.12"

[dev-dependencies]
bytes = "1.10.1"
criterion = "0.8"

[[bench]]
name = "text_recording"
harness = false
