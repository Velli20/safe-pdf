[package]
name = "pdf-object-reader"
version = "0.1.0"
edition = "2024"

[features]
error-backtrace = ["pdf-utils/error-backtrace"]
serde = ["dep:serde"]

[lints]
workspace = true

[dependencies]
pdf-utils = { path = "../pdf-utils" }
thiserror = "2.0.12"
serde = { version = "1", features = ["derive"], optional = true }

bytes = "1.10.1"
num-traits = "0.2.19"
pdf-graphics = { path = "../pdf-graphics" }
