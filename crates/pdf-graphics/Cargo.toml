[package]
name = "pdf-graphics"
version = "0.1.0"
edition = "2024"

# Inherit all lint configurations from the workspace root
[lints]
workspace = true

[features]
serde = ["dep:serde"]
typescript = ["dep:ts-rs"]

[dependencies]
bytes = "1.10.1"
num-traits = "0.2"
num-derive = "0.4"
thiserror = "2.0.12"
serde = { version = "1", features = ["derive"], optional = true }
ts-rs = { version = "12", optional = true }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "image_conversion"
harness = false
