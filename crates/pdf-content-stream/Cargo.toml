[package]
name = "pdf-content-stream"
version = "0.1.0"
edition = "2024"

# Inherit all lint configurations from the workspace root
[lints]
workspace = true

[dependencies]
pdf-parser = { path = "../pdf-parser" }
pdf-tokenizer = { path = "../pdf-tokenizer" }
pdf-object = { path = "../pdf-object" }
pdf-image = { path = "../pdf-image" }
pdf-graphics = { path = "../pdf-graphics" }
pdf-content-stream-operators = { path = "../pdf-content-stream-operators" }
thiserror = "2.0.12"
num-traits = "0.2.19"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "operator_parsing"
harness = false
